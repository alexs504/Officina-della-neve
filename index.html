<style>

.option:nth-child(2){background:#fff7ea}.option:nth-child(3){background:#f2efff}.option:nth-child(4){background:#fff0f2}

@media(min-width:1040px) and (min-height:690px){#scene{width:min(100%,calc((100dvh - 172px) * 42 / 31));margin-inline:auto}.playfield{background:#e7f4f6}}
@media(max-width:870px){.layout{grid-template-columns:minmax(0,1fr) minmax(245px,290px);gap:10px}.shell{padding-top:15px}.mast{margin-bottom:13px}.stage,.wardrobe{border-radius:18px}.stage{padding:8px}.wardrobe{padding:9px}.action{padding-inline:8px;font-size:11px}}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="shell">
<header class="mast">
  <div class="brand"><span class="mark" aria-hidden="true">❄</span><div><h1>OFFICINA DELLA NEVE</h1><p class="kicker">CREA IL TUO PUPAZZO DI NEVE</p></div></div>
  <div class="mast-actions"><button id="full" class="action" type="button"><span class="icon" aria-hidden="true">⛶</span><span class="full-text">TUTTO SCHERMO</span></button></div>
</header>
<main class="layout">
  <section class="stage" aria-labelledby="stage-title">
    <div class="stage-label"><strong id="stage-title"><span class="flake" aria-hidden="true">✦</span> IL MIO PUPAZZO</strong><span class="guide">TRASCINA QUI</span></div>
    <div class="playfield" id="field">
      <canvas id="scene" width="1680" height="1240" role="img" aria-label="PAESAGGIO INVERNALE CON UN PUPAZZO DI NEVE">IL MIO PUPAZZO DI NEVE</canvas>
      <div class="flash" id="flash" aria-hidden="true"></div>
    </div>
    <div class="actions">
      <div>
        <button id="undo" class="action" type="button" disabled><span class="icon" aria-hidden="true">↶</span> ANNULLA</button>
        <button id="reset" class="action" type="button"><span class="icon" aria-hidden="true">↻</span> RICOMINCIA</button>
      </div>
      <div>
        <button id="surprise" class="action" type="button"><span class="icon" aria-hidden="true">✦</span> SORPRESA</button>
        <button id="save" class="action primary" type="button"><span class="icon" aria-hidden="true">▣</span> SALVA IMMAGINE</button>
      </div>
    </div>
  </section>
  <aside class="wardrobe" aria-labelledby="wardrobe-title">
    <div class="wardrobe-head"><span class="badge" aria-hidden="true">🧤</span><h2 id="wardrobe-title">SCEGLI I PEZZI</h2></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="TIPI DI PEZZI"></div>
    <div id="choice-panel" role="tabpanel">
      <div class="options-head"><span id="category-title"></span><button class="remove" id="remove" type="button">TOGLI</button></div>
      <div class="options" id="options"></div>
    </div>
    <p class="legend">TRASCINA UN PEZZO O TOCCALO.</p>
  </aside>
</main>
<div id="status" class="visually-hidden" role="status"></div>
</div>
<script>
'use strict';

const W = 840;
const H = 620;
const scene = document.querySelector('#scene');
const ctx = scene.getContext('2d');
const field = document.querySelector('#field');
const tabs = document.querySelector('#tabs');
const options = document.querySelector('#options');
const undo = document.querySelector('#undo');
const remove = document.querySelector('#remove');
const flash = document.querySelector('#flash');
const status = document.querySelector('#status');
const ink = '#214452';
const categories = {
  body:    { title:'CORPO',       icon:'⛄', items:['DUE PALLE','TRE PALLE','TONDO','ALTO'] },
  hat:     { title:'CAPPELLI',    icon:'🎩', items:['BERRETTO','CILINDRO','PARAORECCHIE','CORONA'] },
  scarf:   { title:'SCIARPE',     icon:'🧣', items:['A RIGHE','A POIS','A STELLE','FIOCCO'] },
  eyes:    { title:'OCCHI',       icon:'👀', items:['TONDI','FURBETTI','FELICI','OCCHIALI'] },
  nose:    { title:'NASI',        icon:'🥕', items:['CAROTA','CILIEGIA','CUORE','STELLA'] },
  mouth:   { title:'BOCCHE',      icon:'😊', items:['SORRISO','A PUNTINI','OH!','RISATA'] },
  arms:    { title:'BRACCIA',     icon:'🧤', items:['RAMETTI','GUANTONI','IN FESTA','A CUORE'] },
  buttons: { title:'BOTTONI',     icon:'🔘', items:['COLORATI','STELLE','CUORI','CARBONE'] },
  prop:    { title:'EXTRA',       icon:'🎁', items:['REGALO','PALLA DI NEVE','LANTERNA','UCCELLINO'] },
  setting: { title:'PAESAGGI',    icon:'🏔️', items:['MONTAGNA','BOSCO','TRAMONTO','NOTTE'] }
};

const bodies = [
  {balls:[[420,424,126,131],[420,245,88,88]],head:245,top:157,neck:319,belly:413},
  {balls:[[420,466,110,91],[420,341,86,89],[420,216,72,75]],head:216,top:141,neck:282,belly:349},
  {balls:[[420,440,146,115],[420,267,98,91]],head:267,top:176,neck:343,belly:431},
  {balls:[[420,424,101,134],[420,226,73,90]],head:226,top:136,neck:302,belly:409}
];

const scenery = [
  {sky:['#a2d9ed','#e4f5fc'],sun:'#fff2bd',far:'#aad8e3',near:'#87bacb',pine:'#408e91',shade:'#2d7079',base:'#f7fdff',hill:'#d9eef6',trail:'#e5f4f9'},
  {sky:['#8ad6cb','#e3f7e9'],sun:'#fff4bc',far:'#9bcdbd',near:'#6ca99b',pine:'#27816c',shade:'#226455',base:'#f7fdfb',hill:'#d9f0e8',trail:'#e3f5ef'},
  {sky:['#b69bd8','#ffd8b8'],sun:'#fff0a6',far:'#c7add7',near:'#a68ebd',pine:'#73679b',shade:'#544979',base:'#fff9fd',hill:'#ecdff4',trail:'#f5eaf7'},
  {sky:['#263875','#6289bd'],sun:'#fdf2c7',far:'#5a75aa',near:'#465e91',pine:'#335b85',shade:'#264365',base:'#eaf5ff',hill:'#ccdff4',trail:'#dfeefa'}
];
const layers = ['arms','body','buttons','eyes','nose','mouth','scarf','hat','prop'];
const snapDistance = {hat:115,scarf:88,eyes:70,nose:67,mouth:69,arms:173,buttons:77,prop:67};
const accessoryColors = ['#ef6573','#1e9887','#8c64c0','#ffb84f'];
const initial = () => ({body:0,setting:0,eyes:0,nose:0,mouth:0,arms:0,offsets:{}});
let state = initial();
let category = 'hat';
let history = [];
let drag = null;
let flashTimer;
let suppressClickUntil = 0;

function ellipse(c,x,y,rx,ry,fill,stroke,width=2) {
  c.beginPath();
  c.ellipse(x,y,rx,ry,0,0,2*Math.PI);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=width; c.stroke(); }
}
function shape(c,points,fill,stroke,width=2) {
  c.beginPath();
  c.moveTo(...points[0]);
  for(const point of points.slice(1)) c.lineTo(...point);
  if(fill){ c.closePath(); c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=width; c.stroke(); }
}
function rounded(c,x,y,w,h,r,fill,stroke,width=2) {
  c.beginPath(); c.roundRect(x,y,w,h,r);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=width; c.stroke(); }
}
function line(c,points,color,width=3){ shape(c,points,null,color,width); }
function curve(c,start,control,end,color,width=4) {
  c.beginPath(); c.moveTo(...start); c.quadraticCurveTo(...control,...end);
  c.strokeStyle=color; c.lineWidth=width; c.stroke();
}
function star(c,x,y,r,fill,points=5,inner=.45) {
  const vertices = Array.from({length:points*2},(_,i)=>{
    const angle = i*Math.PI/points-Math.PI/2;
    const radius = i%2 ? r*inner : r;
    return [x+Math.cos(angle)*radius,y+Math.sin(angle)*radius];
  });
  shape(c,vertices,fill);
}
function heart(c,x,y,s,fill) {
  c.save(); c.translate(x,y); c.scale(s,s);
  c.beginPath(); c.moveTo(0,18); c.bezierCurveTo(-7,10,-23,0,-17,-10);
  c.bezierCurveTo(-13,-17,-4,-16,0,-8); c.bezierCurveTo(4,-16,13,-17,17,-10);
  c.bezierCurveTo(23,0,7,10,0,18); c.fillStyle=fill; c.fill(); c.restore();
}
function hill(c,y,col,rise) {
  c.beginPath(); c.moveTo(0,y); c.bezierCurveTo(180,y-rise,264,y+rise*.75,455,y-3);
  c.bezierCurveTo(635,y-rise*.8,735,y-rise*.2,W,y+7); c.lineTo(W,H); c.lineTo(0,H);
  c.closePath(); c.fillStyle=col; c.fill();
}
function tree(c,x,y,s,p) {
  c.save(); c.translate(x,y); c.scale(s,s);
  ellipse(c,5,1,42,8,p.hill);
  rounded(c,-5,-39,10,44,3,'#8c776c');
  for (const [height,width] of [[87,40],[117,34],[145,24]]) {
    shape(c,[[0,-height],[-width,-height+68],[width,-height+68]],p.pine,p.shade,2);
    shape(c,[[0,-height],[-width*.63,-height+43],[-width*.18,-height+37],[0,-height+44],[width*.31,-height+35],[width*.57,-height+40]],p.base);
  }
  c.restore();
}
function backdrop(c,index) {
  const p=scenery[index];
  const sky=c.createLinearGradient(0,0,0,490);
  sky.addColorStop(0,p.sky[0]); sky.addColorStop(1,p.sky[1]);
  c.fillStyle=sky;c.fillRect(0,0,W,H);
  if(index===3){
    ellipse(c,678,103,38,38,p.sun);
    ellipse(c,694,91,33,33,'#374c86');
    for(let i=0;i<37;i++) star(c,(i*151+57)%825+8,(i*59+21)%235+4,2+(i%5)*.8,i%3===0?'#ffe6a5':'#ebf9ff',4,.28);
  }else{
    ellipse(c,679,109,60,60,index===2?'#fce7be75':'#fff7dc6b');
    ellipse(c,679,109,42,42,p.sun);
    [ [116,101,1],[542,143,.65] ].forEach(([x,y,s])=>{
      ellipse(c,x,y,44*s,10*s,'#ffffff9c'); ellipse(c,x-12*s,y-7*s,14*s,13*s,'#ffffffa8');
      ellipse(c,x+5*s,y-7*s,19*s,14*s,'#ffffff9c');
    });
  }
  const mountains = index===1
    ? [[-66,205,104],[70,185,205],[214,232,254],[388,185,219],[550,229,242],[713,188,175]]
    : [[-70,190,104],[44,139,231],[206,208,220],[376,151,258],[535,218,246],[697,160,191]];
  mountains.forEach(([x,peak,span],i)=>{
    const middle=x+span*.51, floor=430;
    shape(c,[[x,floor],[middle,peak],[x+span,floor]],i%2?p.near:p.far);
    const cap=peak+(floor-peak)*.29;
    shape(c,[[middle,peak],[middle-span*.15,cap],[middle-span*.05,cap-8],[middle+span*.035,cap+4],[middle+span*.09,cap-7],[middle+span*.14,cap]],p.base);
  });
  hill(c,402,p.hill,72);
  const backTrees=index===1?[[36,430,.74],[108,414,1],[203,416,.85],[273,431,.51],[578,435,.65],[636,419,1.08],[728,423,.89],[807,427,1.15]]
    : [[53,429,.64],[179,418,.78],[658,415,.72],[786,428,.67]];
  backTrees.forEach(([x,y,s])=>tree(c,x,y,s,p));
  hill(c,462,p.base,84);
  hill(c,537,p.trail,51);
  hill(c,608,p.base,58);
  [ [100,538,1.23], [729,515,.95], [790,532,.66], [44,505,.58] ].forEach(([x,y,s])=>tree(c,x,y,s,p));
  for(let i=0;i<42;i++) {
    const x=(i*137+25)%830+5;
    const y=(i*71+9)%485+10;
    const r=1.2+(i%4)*.6;
    if(i%9===0) star(c,x,y,r*2.4,'#ffffffc7',4,.24);
    else ellipse(c,x,y,r,r,'#ffffffb4');
  }
  for(const [x,y,s] of [[185,562,1],[669,564,.9],[42,581,1],[764,585,1],[229,503,.6],[612,491,.6]]){
    curve(c,[x-12*s,y],[x,y-5*s],[x+12*s,y],p.hill,3*s);
    curve(c,[x+10*s,y+6*s],[x+17*s,y+3*s],[x+27*s,y+6*s],p.hill,2*s);
  }
}
function snow(c,x,y,rx,ry) {
  const ice=c.createRadialGradient(x-rx*.34,y-ry*.48,ry*.07,x+rx*.19,y+ry*.44,Math.max(rx,ry)*1.35);
  ice.addColorStop(0,'#fff'); ice.addColorStop(.59,'#f9feff'); ice.addColorStop(.83,'#e3f3fa'); ice.addColorStop(1,'#b2d5e8');
  ellipse(c,x,y,rx,ry,ice,'#8ebccd',2);
  c.save();c.globalAlpha=.6;
  curve(c,[x-rx*.78,y-ry*.33],[x-rx*.66,y-ry*.68],[x-rx*.36,y-ry*.8],'#fff',6);
  c.restore();
}
function snowBody(c,index) {
  const body=bodies[index];
  const [x]=body.balls[0];
  ellipse(c,x+6,558,body.balls[0][2]+16,14,'#4688a924');
  body.balls.forEach(ball=>snow(c,...ball));
  ellipse(c,x-52,body.head+21,15,9,'#f6a8ac74');
  ellipse(c,x+52,body.head+21,15,9,'#f6a8ac74');
}
function hat(c,i) {
  if(i===0){
    c.beginPath();c.moveTo(-65,8);c.bezierCurveTo(-60,-83,58,-87,66,8);c.closePath();
    c.fillStyle='#ee6678';c.fill();c.strokeStyle='#a73e58';c.lineWidth=3;c.stroke();
    for(let x=-32;x<=32;x+=16) curve(c,[x,0],[x*1.04,-30],[x*.57,-55],'#fb9ba4',3);
    rounded(c,-72,-7,144,23,10,'#ff9d9d','#a73e58',3);
    for(let x=-58;x<=58;x+=12) line(c,[[x,0],[x,8]],'#f66e80',2);
    ellipse(c,3,-70,16,16,'#ffce66','#a73e58',3);
    star(c,3,-70,10,'#fff0a9',6,.48);
  }else if(i===1){
    shape(c,[[-48,2],[-57,-61],[53,-61],[46,2]],'#314562','#20334d',3);
    shape(c,[[-50,-19],[49,-19],[46,2],[-48,2]],'#f17d51');
    rounded(c,-76,-1,152,17,8,'#314562','#20334d',3);
    rounded(c,-20,-21,24,17,4,'#ffcf62','#b76b36',2);
    rounded(c,-14,-17,12,9,2,'#f17d51');
    line(c,[[-43,-53],[-38,-27]],'#7281a0',4);
  }else if(i===2){
    curve(c,[-67,28],[0,-125],[67,28],'#785cc3',13);
    ellipse(c,-70,28,19,28,'#ac89ef','#5f46a2',3); ellipse(c,70,28,19,28,'#ac89ef','#5f46a2',3);
    ellipse(c,-73,25,10,17,'#d4b7ff'); ellipse(c,73,25,10,17,'#d4b7ff');
  }else{
    shape(c,[[-63,-42],[-31,-19],[0,-59],[29,-19],[62,-42],[47,10],[-47,10]],'#ffd372','#bd7831',3);
    rounded(c,-51,-2,102,17,6,'#f8af4d','#bd7831',3);
    [[-63,-42],[0,-60],[62,-42]].forEach(([x,y])=>ellipse(c,x,y,6,6,'#ffdf8a','#bd7831',2));
    star(c,0,-17,13,'#ec627b');
  }
}
function scarf(c,i) {
  if(i===3){
    shape(c,[[-10,3],[-65,-23],[-65,28],[-8,14]],'#ec667e','#a73e63',3);
    shape(c,[[10,3],[65,-23],[65,28],[8,14]],'#ec667e','#a73e63',3);
    curve(c,[-57,15],[-39,5],[-14,8],'#f9a5ac',4);
    curve(c,[57,15],[39,5],[14,8],'#f9a5ac',4);
    rounded(c,-14,-5,28,26,9,'#ff98a7','#a73e63',3);
    return;
  }
  const colors=[['#1b9b89','#b9f0ce','#176b63'],['#e16b48','#ffe7a2','#a24937'],['#7e62bb','#f4d3ff','#534087']];
  const [base,light,edge]=colors[i];
  c.save();c.translate(49,13);c.rotate(-.22);
  rounded(c,-12,-5,36,82,8,base,edge,3);
  for(let j=0;j<4;j++) line(c,[[-6+j*8,74],[-6+j*8,84]],edge,3);
  if(i===0){for(let y=11;y<70;y+=20) rounded(c,-10,y,32,8,2,light);}
  if(i===1){for(let y=10;y<70;y+=18){ellipse(c,-1,y,3,3,light);ellipse(c,13,y+6,3,3,light);}}
  if(i===2){for(let y=13;y<72;y+=22) star(c,5,y,8,light);}
  c.restore();
  rounded(c,-73,-14,146,31,14,base,edge,3);
  for(let x=-55;x<=54;x+=22){
    if(i===0) rounded(c,x,-11,9,25,3,light);
    if(i===1){ellipse(c,x,-3,4,4,light);ellipse(c,x+10,8,3,3,light);}
    if(i===2) star(c,x,1,9,light);
  }
}
function eyes(c,i) {
  if(i===3){
    line(c,[[-52,-3],[52,-3]],'#325d86',6);
    for(const x of [-26,26]){
      ellipse(c,x,0,21,18,'#c4e8f1','#325d86',5);
      ellipse(c,x+1,1,6,8,ink); ellipse(c,x+3,-2,2,2,'#fff');
    }
  }else if(i===2){
    for(const x of [-27,27]) curve(c,[x-13,5],[x,-16],[x+13,5],ink,5);
  }else{
    for(const [j,x] of [-28,28].entries()){
      ellipse(c,x,0,i===0?9:7,i===0||j===0?11:7,ink);
      ellipse(c,x+2,-3,2.8,3,'#fff');
      if(i===1) curve(c,[x-11,-12],[x,-23+j*6],[x+10,-14],ink,3);
    }
  }
}
function nose(c,i) {
  if(i===0){
    c.beginPath();c.moveTo(-12,-9);c.quadraticCurveTo(7,-10,46,2);c.quadraticCurveTo(16,12,-10,11);
    c.quadraticCurveTo(-18,3,-12,-9);c.fillStyle='#f59145';c.fill();c.strokeStyle='#be582b';c.lineWidth=2.5;c.stroke();
    line(c,[[0,-5],[2,3]],'#c25b30',2);line(c,[[14,0],[16,5]],'#c25b30',2);
  }else if(i===1){
    ellipse(c,0,0,14,12,'#e86577','#a33656',3);ellipse(c,-4,-4,4,3,'#ffc0c8');
  }else if(i===2){
    heart(c,0,0,.88,'#ea6389');ellipse(c,-7,-5,3,2,'#ffc6d8');
  }else{
    star(c,0,1,16,'#d48a2c');star(c,0,0,13,'#ffd269');
  }
}
function mouth(c,i) {
  if(i===0){curve(c,[-24,-1],[0,25],[24,-1],ink,4);}
  if(i===1){for(const [x,y] of [[-25,-5],[-15,4],[0,8],[15,4],[25,-5]]) ellipse(c,x,y,3.8,3.8,ink);}
  if(i===2){ellipse(c,0,3,12,15,ink);ellipse(c,1,10,5,4,'#ff98a3');}
  if(i===3){
    c.beginPath();c.moveTo(-26,-5);c.quadraticCurveTo(0,4,26,-5);c.quadraticCurveTo(14,22,0,20);c.quadraticCurveTo(-17,20,-26,-5);
    c.fillStyle=ink;c.fill();ellipse(c,3,13,9,4,'#ff97a0');
  }
}
function arms(c,i) {
  const wood='#805445';
  const raised=i>1;
  for(const side of [-1,1]){
    c.save();c.scale(side,1);
    const y=raised?-75:-36;
    line(c,[[72,13],[132,-7],[166,y]],wood,11);
    line(c,[[77,11],[133,-10],[163,y+3]],'#ad765b',3);
    if(i===0){
      line(c,[[149,-22],[151,-52]],wood,6);line(c,[[154,-23],[183,-26]],wood,6);
    }else if(i===2){
      line(c,[[154,-53],[182,-61]],wood,6);line(c,[[158,-61],[149,-87]],wood,6);
    }else if(i===3){
      heart(c,166,y-8,1.06,'#d95074');heart(c,165,y-11,.75,'#ff8da1');
    }else{
      c.save();c.translate(169,y-6);c.rotate(.9);
      rounded(c,-17,-23,29,37,13,'#ffb853','#a46733',3);
      ellipse(c,-15,0,8,10,'#ffb853','#a46733',2);
      rounded(c,-13,9,23,9,4,'#ef7778','#a04958',2);
      c.restore();
    }
    c.restore();
  }
}
function buttons(c,i) {
  for(let j=0;j<3;j++){
    const y=(j-1)*27;
    if(i===0){
      ellipse(c,0,y,10,10,accessoryColors[j],'#38606c',2);
      ellipse(c,-3,y,1.7,1.7,'#fff');ellipse(c,3,y,1.7,1.7,'#fff');
    }
    if(i===1){star(c,0,y,13,'#bf8036');star(c,0,y,10,'#ffd06a');}
    if(i===2){heart(c,0,y,.62,'#df6284');}
    if(i===3){shape(c,[[-10,y+3],[-7,y-7],[1,y-10],[10,y-5],[9,y+5],[3,y+10],[-6,y+8]],'#385665');ellipse(c,-3,y-4,3,2,'#698798');}
  }
}
function prop(c,i) {
  if(i===0){
    rounded(c,-43,-40,86,69,8,'#ef7f77','#963f57',3);
    rounded(c,-48,-47,96,21,6,'#fa9b8c','#963f57',3);
    rounded(c,-9,-48,18,76,2,'#ffe197');
    for(const x of [-1,1]) curve(c,[0,-47],[x*50,-87],[x*17,-54],'#db5465',6);
    ellipse(c,0,-48,8,6,'#ffe197');
  }else if(i===1){
    snow(c,-21,14,24,23);snow(c,21,14,24,23);snow(c,0,-14,26,26);
  }else if(i===2){
    ellipse(c,0,-45,21,15,null,'#524971',5);
    rounded(c,-25,-34,50,64,10,'#ffe083','#6e5076',4);
    rounded(c,-32,-37,64,12,5,'#806489','#584464',3);
    rounded(c,-32,24,64,11,5,'#806489','#584464',3);
    line(c,[[0,-25],[0,23]],'#b88477',3);star(c,-1,1,17,'#fff6d1',4,.38);
  }else{
    shape(c,[[-21,5],[-49,-8],[-45,14],[-20,24]],'#5b78b9','#344f91',2);
    ellipse(c,-1,13,32,22,'#73a8e3','#385990',3);
    ellipse(c,19,-8,20,18,'#80bbeb','#385990',3);
    shape(c,[[36,-8],[51,-4],[37,0]],'#f4ae4c','#be712c',2);
    ellipse(c,25,-11,3.3,3.3,ink); ellipse(c,-7,14,15,8,'#577dbb');
    line(c,[[-4,34],[-4,39],[-12,40]],'#8f614d',3);line(c,[[10,34],[10,39],[17,40]],'#8f614d',3);
  }
}
const drawPiece={hat,scarf,eyes,nose,mouth,arms,buttons,prop};
const previewBounds={
  hat:[-86,-88,172,147],scarf:[-79,-26,158,110],eyes:[-57,-24,114,48],nose:[-19,-19,68,43],
  mouth:[-31,-20,62,43],arms:[-194,-99,388,122],buttons:[-15,-42,30,84],prop:[-53,-79,106,122]
};
function thumbnail(canvas,key,index) {
  const c=canvas.getContext('2d');
  c.clearRect(0,0,canvas.width,canvas.height);
  c.lineCap=c.lineJoin='round';
  const fit = (width,height) => Math.min(canvas.width/width,canvas.height/height);
  if(key==='setting'){
    const scale=fit(W,H);
    c.translate((canvas.width-W*scale)/2,(canvas.height-H*scale)/2);
    c.scale(scale,scale);backdrop(c,index);return;
  }
  if(key==='body'){
    const scale=fit(370,460);
    c.translate(canvas.width/2-420*scale,canvas.height/2-350*scale);
    c.scale(scale,scale);snowBody(c,index);return;
  }
  const [x,y,w,h]=previewBounds[key];
  const scale=fit(w+8,h+8);
  c.translate(canvas.width/2-(x+w/2)*scale,canvas.height/2-(y+h/2)*scale);
  c.scale(scale,scale);
  drawPiece[key](c,index);
}
function anchor(key) {
  const b=bodies[state.body];
  const y={hat:b.top+7,scarf:b.neck,eyes:b.head-18,nose:b.head+9,mouth:b.head+36,arms:b.neck+57,buttons:b.belly};
  return key==='prop'?[611,514]:[420,y[key]];
}
function position(key) {
  const [x,y]=anchor(key);
  const [dx,dy]=state.offsets[key] || [0,0];
  return legalPosition(key,x+dx,y+dy);
}
function render() {
  ctx.setTransform(2,0,0,2,0,0);
  ctx.lineCap=ctx.lineJoin='round';
  backdrop(ctx,state.setting);
  for(const key of layers){
    const index=state[key];
    if(index==null) continue;
    if(key==='body'){snowBody(ctx,index);continue;}
    const [x,y]=drag?.mode==='move'&&drag.key===key&&drag.preview?drag.preview:position(key);
    ctx.save();ctx.translate(x,y);drawPiece[key](ctx,index);ctx.restore();
  }
  scene.style.cursor=drag?.mode==='move'?'grabbing':'default';
}
function markSelection() {
  for(const button of options.querySelectorAll('.option')) button.setAttribute('aria-pressed',Number(button.dataset.index)===state[category]);
  undo.disabled=history.length===0;
  remove.hidden=category==='body'||category==='setting';
  remove.disabled=state[category]==null;
}
function say(message) {
  status.textContent=message;
  flash.textContent=message;
  flash.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>flash.classList.remove('show'),1400);
}
function change(next,message) {
  if(JSON.stringify(next)!==JSON.stringify(state)){
    history.push(state);
    if(history.length>40) history.shift();
    state=next;
  }
  render();markSelection();
  if(message) say(message);
}
function put(key,index,offset) {
  const offsets={...state.offsets};
  if(offset) offsets[key]=offset;
  else if(state[key]!==index) delete offsets[key];
  change({...state,[key]:index,offsets},categories[key].items[index]+'!');
}
function showCategory(key,focus=false) {
  category=key;
  for(const button of tabs.children){
    const selected=button.dataset.key===key;
    button.setAttribute('aria-selected',selected);
    button.tabIndex=selected?0:-1;
    if(selected&&focus) button.focus();
  }
  const group=categories[key];
  document.querySelector('#choice-panel').setAttribute('aria-labelledby','tab-'+key);
  document.querySelector('#category-title').textContent=group.title;
  options.replaceChildren();
  group.items.forEach((label,index)=>{
    const button=document.createElement('button');
    button.type='button';button.className='option';button.dataset.index=index;
    const thumb=document.createElement('canvas');
    thumb.width=176;thumb.height=110;thumb.setAttribute('aria-hidden','true');
    thumbnail(thumb,key,index);
    const name=document.createElement('span');name.textContent=label;
    button.append(thumb,name);
    button.addEventListener('click',event=>{
      if(event.detail!==0&&performance.now()<suppressClickUntil) return;
      put(key,index);
    });
    button.addEventListener('pointerdown',event=>startPalette(event,key,index));
    options.append(button);
  });
  markSelection();
}
for(const [key,group] of Object.entries(categories)){
  const button=document.createElement('button');
  button.type='button';button.className='tab';button.id='tab-'+key;button.dataset.key=key;
  button.setAttribute('role','tab');button.setAttribute('aria-controls','choice-panel');
  const icon=document.createElement('span');icon.className='symbol';icon.textContent=group.icon;icon.setAttribute('aria-hidden','true');
  const label=document.createElement('span');label.textContent=group.title;
  button.append(icon,label);button.addEventListener('click',()=>showCategory(key));tabs.append(button);
}
tabs.addEventListener('keydown',event=>{
  const keys=Object.keys(categories);
  const columns=getComputedStyle(tabs).gridTemplateColumns.split(' ').length;
  const offsets={ArrowLeft:-1,ArrowRight:1,ArrowUp:-columns,ArrowDown:columns};
  if(event.key==='Home'||event.key==='End'){
    event.preventDefault();showCategory(keys[event.key==='Home'?0:keys.length-1],true);
  }else if(event.key in offsets){
    event.preventDefault();
    showCategory(keys[(keys.indexOf(category)+keys.length+offsets[event.key])%keys.length],true);
  }
});

function scenePoint(event) {
  const box=scene.getBoundingClientRect();
  return [(event.clientX-box.left)*W/box.width,(event.clientY-box.top)*H/box.height];
}
function inside([x,y]){return x>=0&&x<=W&&y>=0&&y<=H;}
function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
function legalPosition(key,x,y) {
  const [bx,by,bw,bh]=previewBounds[key];
  return [clamp(x,8-bx,W-8-bx-bw),clamp(y,8-by,H-8-by-bh)];
}
function getPieceAt(x,y) {
  for(const key of [...layers].reverse()){
    if(key==='body'||state[key]==null) continue;
    const [px,py]=position(key);
    const [bx,by,bw,bh]=previewBounds[key];
    if(key==='arms' && Math.abs(x-px)<94) continue;
    if(x>=px+bx && x<=px+bx+bw && y>=py+by && y<=py+by+bh) return key;
  }
  return null;
}
function startPalette(event,key,index) {
  if(drag||event.button!==0) return;
  drag={mode:'add',id:event.pointerId,key,index,client:[event.clientX,event.clientY]};
  event.currentTarget.setPointerCapture(event.pointerId);
}
scene.addEventListener('pointerdown',event=>{
  if(drag||event.button!==0) return;
  const [x,y]=scenePoint(event);
  const key=getPieceAt(x,y);
  if(!key) return;
  const [px,py]=position(key);
  drag={mode:'move',id:event.pointerId,key,delta:[px-x,py-y],client:[event.clientX,event.clientY]};
  scene.setPointerCapture(event.pointerId);
});
scene.addEventListener('pointermove',event=>{
  if(drag) return;
  scene.style.cursor=getPieceAt(...scenePoint(event))?'grab':'default';
});
window.addEventListener('pointermove',event=>{
  if(!drag||event.pointerId!==drag.id) return;
  if(!drag.moved&&Math.hypot(event.clientX-drag.client[0],event.clientY-drag.client[1])<7) return;
  drag.moved=true;
  const point=scenePoint(event);
  if(drag.mode==='add'){
    if(!drag.ghost){
      drag.ghost=document.createElement('canvas');
      drag.ghost.className='ghost';drag.ghost.width=256;drag.ghost.height=192;
      drag.ghost.setAttribute('aria-hidden','true');
      thumbnail(drag.ghost,drag.key,drag.index);
      document.body.append(drag.ghost);
    }
    drag.ghost.style.left=event.clientX+'px';drag.ghost.style.top=event.clientY+'px';
    field.classList.toggle('target',inside(point));
  }else{
    drag.preview=legalPosition(drag.key,point[0]+drag.delta[0],point[1]+drag.delta[1]);
    render();
  }
});
window.addEventListener('pointerup',finishDrag);
window.addEventListener('pointercancel',finishDrag);
window.addEventListener('lostpointercapture',finishDrag);
function finishDrag(event) {
  if(!drag||event.pointerId!==drag.id) return;
  const finished=drag;
  drag=null;finished.ghost?.remove();field.classList.remove('target');
  if(finished.moved && finished.mode==='add') suppressClickUntil=performance.now()+220;
  if(event.type!=='pointerup'||!finished.moved){if(finished.mode==='move') render();return;}
  const point=scenePoint(event);
  if(!inside(point)){render();if(finished.mode==='add') say('TRASCINA IL PEZZO SULLA NEVE.');return;}
  const key=finished.key;
  if(finished.mode==='add'){
    if(key==='body'||key==='setting'){put(key,finished.index);return;}
    const [ax,ay]=anchor(key);
    const near=Math.hypot(point[0]-ax,point[1]-ay)<snapDistance[key];
    const [x,y]=near?[ax,ay]:legalPosition(key,...point);
    put(key,finished.index,[x-ax,y-ay]);
  }else if(finished.preview){
    const [ax,ay]=anchor(key);
    const [x,y]=legalPosition(key,point[0]+finished.delta[0],point[1]+finished.delta[1]);
    change({...state,offsets:{...state.offsets,[key]:[x-ax,y-ay]}});
  }
}
remove.addEventListener('click',()=>{
  if(category==='body'||category==='setting'||state[category]==null) return;
  const next={...state,offsets:{...state.offsets}};
  delete next[category];delete next.offsets[category];
  change(next,'PEZZO TOLTO.');
});
undo.addEventListener('click',()=>{
  if(!history.length) return;
  state=history.pop();render();markSelection();say('FATTO!');
});
document.querySelector('#reset').addEventListener('click',()=>change(initial(),'SI RICOMINCIA!'));
document.querySelector('#surprise').addEventListener('click',()=>{
  const next={offsets:{}};
  for(const [key,group] of Object.entries(categories)) next[key]=Math.floor(Math.random()*group.items.length);
  if(next.hat===state.hat) next.hat=(next.hat+1)%categories.hat.items.length;
  change(next,'SORPRESA!');
});
document.querySelector('#save').addEventListener('click',()=>{
  scene.toBlob(blob=>{
    if(!blob){say('RIPROVA A SALVARE.');return;}
    const link=document.createElement('a');
    link.href=URL.createObjectURL(blob);link.download='Il_mio_pupazzo_di_neve.png';
    document.body.append(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(link.href),30000);
    say('IMMAGINE PRONTA!');
  },'image/png');
});
const full=document.querySelector('#full');
function fullscreenLabel() {
  const label=document.fullscreenElement?'ESCI DA TUTTO SCHERMO':'TUTTO SCHERMO';
  full.querySelector('.full-text').textContent=label;full.setAttribute('aria-label',label);
}
if(!document.fullscreenEnabled||!document.documentElement.requestFullscreen) full.hidden=true;
else {
  fullscreenLabel();
  full.addEventListener('click',async ()=>{
    try{
      if(document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    }catch{say('SCHERMO INTERO NON DISPONIBILE.');}
  });
  document.addEventListener('fullscreenchange',fullscreenLabel);
}
showCategory(category);render();
</script>
